# 【目的】依赖声明；与 rag-agent 基本同构，便于对比学习。
# 【易错点】Windows 少用 uv run cs-agent；用 python -m uvicorn 更稳。
[project]
name = "cs-agent"
version = "0.1.0"
description = "企业客服 Agent：架构对齐 rag-agent（FastAPI + PG + Redis + LangChain + RAG）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "fastembed>=0.5.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "mcp>=2.3.0",
]

[project.scripts]
cs-agent = "cs_agent.main:run"
cs-agent-mcp = "cs_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
