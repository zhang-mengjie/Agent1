# ---------------------------------------------------------------------------
# 【目的】声明包名、Python 版本与依赖；`uv sync` 据此装 .venv。
# 【易错点】
# 1. requires-python >=3.12：低版本装不上或语法报错。
# 2. 不要用 Bun 跑本项目（Agent SDK/部分 HTTP 流会坏）；本栈用 Node 无关，Python 用官方解释器。
# 3. Windows：尽量 `python -m uvicorn ...`，少用 `uv run xxx` 锁住 Scripts\*.exe。
# 4. mcp / python-multipart / pypdf / fastembed 缺任一都会在对应功能时报 ImportError。
# ---------------------------------------------------------------------------
[project]
name = "rag-agent"
version = "0.1.0"
description = "简易 RAG Agent：FastAPI + Pydantic + PostgreSQL + Redis + LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",                 # Web API
    "uvicorn[standard]>=0.32.0",        # ASGI 服务器
    "pydantic>=2.9.0",                  # 请求/响应模型
    "pydantic-settings>=2.6.0",         # .env → Settings
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.36",      # ORM；对话表异步
    "asyncpg>=0.30.0",                  # 异步 PG 驱动（DATABASE_URL）
    "psycopg[binary]>=3.2.0",           # 同步 PG 驱动（向量写入更简单）
    "redis>=5.2.0",                     # 会话记忆
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",          # ChatOpenAI / OpenAIEmbeddings
    "langchain-community>=0.3.0",       # FastEmbedEmbeddings
    "langchain-text-splitters>=0.3.0",  # 文本切块
    "pgvector>=0.3.0",                  # vector 类型支持
    "httpx>=0.27.0",
    "fastembed>=0.5.0",                 # 本地 embedding
    "pypdf>=5.0.0",                     # PDF 抽文本
    "python-multipart>=0.0.12",         # 上传文件必需
    "mcp>=2.3.0",                       # Cursor MCP 工具
]

[project.scripts]
# 控制台入口；Windows 下更推荐 python -m uvicorn，避免 exe 文件锁
rag-agent = "rag_agent.main:run"
rag-agent-mcp = "rag_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
