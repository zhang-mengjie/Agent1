# ---------------------------------------------------------------------------
# rag-agent 基础设施（Postgres + Redis）
#
# 【目的】本地一键起库，不必本机安装 Postgres/Redis。
# 【用法】在 rag-agent 目录：docker compose up -d
# 【易错点】
# 1. 没装 Docker Desktop / 选错 CPU 架构（Windows 一般选 AMD64）→ 起不来。
# 2. 端口 "5432:5432" 左边是「宿主机端口」。若被占用，改左边，并同步改 .env。
# 3. 必须用带 pgvector 的镜像；普通 postgres 没有 vector 扩展，向量表会失败。
# 4. volumes 持久化数据：删容器不会丢数据；要清空知识库需 docker volume rm。
# ---------------------------------------------------------------------------
services:
  postgres:
    # pgvector/pgvector:pg16 = Postgres 16 + 向量扩展
    image: pgvector/pgvector:pg16
    container_name: rag-agent-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_agent
    ports:
      # 宿主机 5432 → 容器内 5432（与 .env DATABASE_URL 一致）
      - "5432:5432"
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      # 应用启动前建议等 healthy，否则会出现 ConnectionRefused
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rag-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - rag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rag_pg_data:
  rag_redis_data:
