# 【目的】财务 Agent 依赖 = rag 同构 + 发票 OCR/渲染。
# 【易错点】
# - rapidocr-onnxruntime / pypdfium2 / pillow 缺了，图片发票会失败。
# - Windows 启动用 python -m uvicorn，少用 uv run 锁 exe。
[project]
name = "finance-agent"
version = "0.1.0"
description = "企业财务审批 Agent：报销结构化、制度检索、标准/预算校验、风险分级、动态审批、ERP 落单"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "fastembed>=0.5.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",              # 扫描 PDF → 图像再 OCR
    "pillow>=10.0.0",                 # 打开发票图片
    "rapidocr-onnxruntime>=1.4.0",    # 中文 OCR
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.0",                # Excel 导出（避免 CSV 中文乱码）
    "mcp>=2.3.0",
]

[project.scripts]
finance-agent = "finance_agent.main:run"
finance-agent-mcp = "finance_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
